spring:
  application:
    name: commodule-project-template
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

commodule:
  web:
    trace-id-header: X-Trace-Id
  file-storage:
    provider: local
    base-dir: ${java.io.tmpdir}/commodule-files
    max-file-size: 10MB
  cache:
    provider: memory
    default-ttl: 5m
    max-entries: 1000
  mq:
    provider: memory
    max-attempts: 3
    retry-backoff: 100ms
    max-dead-letters: 100
    worker-threads: 2
    queue-capacity: 1000
  auth:
    secret: ${COMMODULE_AUTH_SECRET:commodule-change-me-32-byte-secret-key}
    token-ttl: 2h
    issuer: commodule-project-template
    base-path: /api/auth
    refresh-token-ttl: 7d
    refresh-token-max-per-user: 10
    cors-allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    cors-allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    cors-allowed-headers:
      - "*"
    cors-exposed-headers:
      - X-Trace-Id
    cors-allow-credentials: false
    cors-max-age: 1h
  data-permission:
    enabled: true
    admin-role: ADMIN
  code-generator:
    enabled: true

